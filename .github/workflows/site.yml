name: Build aiveterinary.org

on:
  push:
    paths: ['aiveterinary/site/**']
  pull_request:
    paths: ['aiveterinary/site/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: aiveterinary/site } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: aiveterinary/site/package-lock.json }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: site, path: aiveterinary/site/dist }
