name: Vet tool core

on:
  push:
    paths: ['aiveterinary/app/**']
  pull_request:
    paths: ['aiveterinary/app/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: aiveterinary/app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: aiveterinary/app/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval
