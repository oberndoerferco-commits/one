<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oberndörfer Nameplate</title>
<style>
  :root{
    --bg:#111113; --panel:#18181b; --line:#2a2a2f; --ink:#ececee;
    --mute:#8d8d96; --hot:#c9a227; --plate:#f4f1e8; --key:#121214;
    --gutl:max(16px,env(safe-area-inset-left,0px));
    --gutr:max(16px,env(safe-area-inset-right,0px));
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f2f1ee; --panel:#ffffff; --line:#dedcd6; --ink:#1b1b1d;
      --mute:#6c6c74; --plate:#f7f5ee; --key:#17171a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111113; --panel:#18181b; --line:#2a2a2f; --ink:#ececee;
    --mute:#8d8d96; --plate:#f4f1e8; --key:#121214;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{padding:10px var(--gutr) 8px var(--gutl);border-bottom:1px solid var(--line);
    display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  h1{margin:0;font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:650}
  .sub{color:var(--mute);font-size:12px}
  main{flex:1;min-height:0;display:flex;flex-direction:column}
  #stage{flex:1;min-height:0;position:relative;overflow:hidden;
    background:repeating-conic-gradient(var(--bg) 0% 25%, color-mix(in srgb,var(--bg) 92%, #808080) 0% 50%) 50%/22px 22px}
  #stage svg{position:absolute;inset:0;width:100%;height:100%}
  .panel{border-top:1px solid var(--line);background:var(--panel);
    max-height:48vh;overflow-y:auto;overscroll-behavior:contain;
    padding:10px var(--gutr) calc(10px + env(safe-area-inset-bottom,0px)) var(--gutl)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 22px}
  .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;
    padding:3px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
  .row label{color:var(--mute);font-size:12px}
  .row b{font-variant-numeric:tabular-nums;font-weight:600;font-size:12px;min-width:76px;text-align:right}
  input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--hot);margin:0}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
  button{font:inherit;font-size:12px;color:var(--ink);background:transparent;
    border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
  button[aria-pressed=true]{border-color:var(--hot);color:var(--hot)}
  button.go{border-color:var(--hot);color:var(--hot)}
  .note{color:var(--mute);font-size:11.5px;margin:8px 0 0;max-width:62ch}
  .boot{position:absolute;inset:0;display:grid;place-content:center;color:var(--mute);
    font-size:12px;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<header>
  <h1>Oberndörfer nameplate</h1>
  <span class="sub" id="dims">—</span>
</header>
<main>
  <div id="stage"><div class="boot" id="boot">Tracing…</div></div>
  <div class="panel" id="panel"></div>
</main>

<script>
/* The plate, taken apart and put back together.

   The artwork was one flat picture: eleven letters already turned onto
   one arch inside one frame. arch_plate.py fitted the circle the whole
   thing was struck about, turned every letter back by its own angle, and
   wrote what was left - upright outlines, and the arc distance from each
   letter to the next.

   So the arch is a parameter again. Everything here is drawn from those
   outlines: the letters are placed along a circle of whatever radius the
   rise asks for, each one turned by its own angle on it, and the frame is
   two arcs struck about the same centre with rounded ends. Nothing is
   stretched or re-traced - the letterforms are the ones in the picture,
   to a third of a pixel.

   Units are millimetres throughout. The source has no scale of its own,
   so cap height sets it: at 10.7 mm the plate comes out the size the
   drawing implies if its frame were 100 mm across. */

var DOC = null, G = {};
var S = {
  cap: 10.74,        // mm, cap height of the letters
  rise: 4.80,        // mm, how far the baseline bows over the word
  track: 1.10,       // mm, added between every pair of letters
  mtop: 1.40,        // mm, highest ink to the inside of the top keyline
  mbot: 3.00,        // mm, lowest ink to the inside of the bottom keyline
  endgap: 9.20,      // mm, arc past the first and last letter's centre.
                     // 5.09 was the drawing's own and the last R crosses
                     // the keyline there; 6.69 is where it first clears,
                     // and these three together leave 1.43 mm all round.
  key: 0.69,         // mm, keyline weight
  round: 1.0,        // 0 square ends, 1 fully rounded
  bw: false,         // pure black and white, for the drawing itself
  engraved: true,    // outline, hatching, highlight and shadow
  detail: true,      // the drawing's own lines rather than a synthetic
                     // keyline: flourishes, inline, cast shadow and all
  outline: 0.17,     // mm, a keyline on the letter's own boundary. The
                     // drawn line work carries the flourishes, the inner
                     // line and the shadow, but not this: where a stroke
                     // meets its own highlight the drawn edge is lighter
                     // than the cut that lifts the line work out, so the
                     // lit side comes back without a boundary and the
                     // ruling runs into the paper.
  halo: 0,           // mm, paper between that keyline and its inline. It
                     // has to clear half the keyline's own weight or the
                     // keyline paints over the gap and the two lines
                     // read as one thick one.
  inline: 0,         // mm, the second line, just inside the halo
  edge: 0,           // mm, the line where the hatching stops
  hatching: true,    // the ruled shading itself. Off leaves an outlined
                     // letter with a paper centre - the drawn lines and
                     // the shadow still there, the shading not.
  pitch: 0.26,       // mm, centre to centre of the ruled hatching
  hatch: 0.10,       // mm, weight of one hatch line
  tip: 0,            // mm, the ends come to a POINT this far past the
                     // frame instead of being rounded off. The rounded
                     // end is the single strongest soft cue in the
                     // mark; a point is what the pendant already does,
                     // and the plate should not contradict it.
  pick: null,        // indices of the letters to set, or null for the
                     // whole word. One letter makes a maker's mark: the
                     // same drawn O, at a size the word cannot reach.
  invert: false,     // ink plate, paper letters. The mark stops being
                     // an outline round some white and becomes a solid
                     // object, which is most of what reads as weight.
  rule: 0,           // mm, an inner keyline set this far inside the
                     // frame. 0 for none.
  rulew: 0.34,       // mm, its weight - lighter than the frame's, or
                     // the two read as one thick band
  cut: false,        // solid letters with the drawing's OWN ornament
                     // knocked out of them in paper, rather than drawn
                     // over paper. Keeps the black mass of the plain
                     // version and gets the barbs and curls back.
  optical: true,     // space the letters by the paper they leave,
                     // not by the steps the artwork happens to have
  frame: true,       // the plate itself. Off keeps the arch and the
                     // banner's place, and drops the surround.
  banner: true,      // the swallowtail under the plate
  bgap: -1.10,       // mm, from the plate's lower keyline to the banner.
                     // Negative tucks the band up BEHIND the plate, which
                     // is what joins the two: the plate's own keyline is
                     // then the line they share and the ribbon comes out
                     // from under it rather than hanging below it.
  bdepth: 6.40,      // mm, depth of the shoulders below that keyline -
                     // what is on show, whatever the overlap above it
  bwidth: 46.0,      // mm, its length along the arc
  bpoint: 4.20,      // mm, how much further the centre drops - the
                     // point the two bottom sweeps meet at
  bcurve: 0.55,      // how much the bottom edge sweeps on its way there,
                     // 0 being a plain straight V
  bround: 1.60,      // mm, the fillet at each shoulder
  bcap: 2.90,        // mm, cap height of the banner's type
  btrack: 0.55,      // mm, between its letters
  shadow: 0,         // mm, how far a cast shadow drops. The drawing's own
                     // is welded into the silhouette and cannot be taken
                     // off it cleanly, so this adds a second one.
  inlay: true,       // leave the lit side of each stroke blank
  ghost: false,      // the source picture underneath
  reuse: false       // one drawing per repeated letter
};
var D0 = JSON.parse(JSON.stringify(S));

function el(t, c, txt){
  var e = document.createElementNS('http://www.w3.org/2000/svg', t);
  if (c) e.setAttribute('class', c);
  if (txt != null) e.textContent = txt;
  return e;
}
function h(t, c, txt){
  var e = document.createElement(t);
  if (c) e.className = c;
  if (txt != null) e.textContent = txt;
  return e;
}

/* --- geometry -------------------------------------------------------- */

/* A chord of arc length s bows by `rise`. Radius from the two of them has
   no closed form, so it is bisected: rise/R = 1 - cos(s/2R) falls
   monotonically in R, which is all bisection needs. A straight line is
   rise 0, and there R is infinite - handled as its own case rather than
   as a very large number, because a 10^9 mm radius makes the arc commands
   in the exported SVG useless. */
function radiusFor(arcLen, rise){
  if (rise <= 1e-6) return Infinity;
  var lo = arcLen / 2 / Math.PI, hi = 1e7;
  for (var i = 0; i < 90; i++){
    var m = (lo + hi) / 2, a = arcLen / (2 * m);
    if (a > Math.PI) { lo = m; continue; }
    if (m * (1 - Math.cos(a)) > rise) lo = m; else hi = m;
  }
  return (lo + hi) / 2;
}

/* Where each letter sits: its arc distance from the middle of the word,
   and the angle that distance comes to on the current radius. The step
   from one letter to the next is the one measured in the picture, so at
   tracking zero the spacing is the artwork's own - uneven, 109 to 131
   source pixels, which is part of why it reads as drawn by hand. */
function layout(){
  var mm = S.cap / DOC.arc.cap;              // mm per source pixel
  var L = DOC.letters, fit = DOC.fit;
  if (S.pick && S.pick.length){
    /* A subset keeps the letters' own drawings and their own widths,
       but not the spacing: the optical fit was solved for the pairs
       that stand next to each other in the word, and these do not. For
       one letter there is no pair at all, which is the case this is
       really for. */
    var pk = S.pick.slice().sort(function(a, b){ return a - b; });
    var L2 = [], f2 = [];
    for (var k = 0; k < pk.length; k++){
      L2.push(L[pk[k]]);
      if (k < pk.length - 1)
        f2.push(pk[k+1] - pk[k] === 1 && fit ? fit[pk[k]]
                : (L[pk[k+1]].angle - L[pk[k]].angle)
                  * Math.PI / 180 * DOC.arc.r_base);
    }
    L = L2; fit = f2;
  }
  var n = L.length;
  var step = [];
  for (var i = 0; i < n - 1; i++){
    /* Two ways to decide where the next letter goes. The artwork's own
       step, which is where it was drawn - 18% apart end to end, and the
       paper those steps leave between letters 50% uneven, which is the
       number the eye is actually reading. Or the optical fit measured
       off the letters' profiles, which is the same word length with
       that figure at nil. */
    var d = S.optical && fit
      ? fit[i]
      : (L[i+1].angle - L[i].angle) * Math.PI / 180 * DOC.arc.r_base;
    step.push(d * mm + S.track);
  }
  var at = [0];
  for (i = 0; i < step.length; i++) at.push(at[i] + step[i]);
  var span = at[n-1];
  for (i = 0; i < n; i++) at[i] -= span / 2;

  var R = radiusFor(span, S.rise);
  var out = [];
  for (i = 0; i < n; i++){
    var src = S.reuse ? L[firstOf(L[i].ch)] : L[i];
    var a = R === Infinity ? 0 : at[i] / R;             // radians
    out.push({
      ch: L[i].ch, src: src, deg: a * 180 / Math.PI,
      x: R === Infinity ? at[i] : R * Math.sin(a),
      y: R === Infinity ? 0     : R * (1 - Math.cos(a))
    });
  }
  return { R: R, span: span, mm: mm, at: at, place: out };
}
var FIRST = {};
function firstOf(ch){
  if (FIRST[ch] == null)
    for (var i = 0; i < DOC.letters.length; i++)
      if (DOC.letters[i].ch === ch) { FIRST[ch] = i; break; }
  return FIRST[ch];
}

/* How far the ink reaches above the baseline and below it, in mm. The
   round letters overshoot both ways, and the umlaut reaches furthest of
   all, so the frame has to be told by the letters rather than by the cap
   height. */
function reach(lay){
  var up = 0, dn = 0;
  for (var i = 0; i < lay.place.length; i++){
    var b = bounds(lay.place[i].src);
    up = Math.max(up, -b.y0); dn = Math.max(dn, b.y1);
  }
  return { up: up * lay.mm, dn: dn * lay.mm };
}
var BOX = new WeakMap();
function bounds(g){
  if (BOX.has(g)) return BOX.get(g);
  var xs = [], ys = [];
  g.paths.forEach(function(d){
    var m = d.match(/-?\d+(\.\d+)?/g) || [];
    for (var i = 0; i + 1 < m.length; i += 2){ xs.push(+m[i]); ys.push(+m[i+1]); }
  });
  var b = { x0: Math.min.apply(null, xs), x1: Math.max.apply(null, xs),
            y0: Math.min.apply(null, ys), y1: Math.max.apply(null, ys) };
  BOX.set(g, b); return b;
}

/* The frame: two arcs about the same centre as the letters, closed at
   each end with a flat radial edge and a fillet into each arc. At full
   rounding the two fillets meet and the flat vanishes, which is the
   stadium end the artwork has; at nothing they vanish instead and the
   end is a square radial cut.

   It was one arc of radius depth/2 x rounding to begin with, which is
   only a shape when rounding is 1: below that the radius is too small to
   reach from one keyline to the other, and SVG quietly scales a radius
   that cannot fit, so every setting under 100 per cent drew something
   that was not the thing asked for. Hence the fillets.

   The source is not quite like this either - its two keylines were
   struck about centres 71 px apart, so the real plate is 257 px deep in
   the middle and 263 at the ends. Concentric is a 1.4 per cent change
   and makes the thing describable in one radius and one depth, which is
   what a maker needs. */
function endCaps(lay, r, inset){
  inset = inset || 0;
  var R = lay.R, f = (r.rt - r.rb) / 2 * S.round;
  var a0 = lay.at[0] - S.endgap + inset,
      a1 = lay.at[lay.at.length - 1] + S.endgap - inset;
  var out = [];
  [[a0, -1], [a1, +1]].forEach(function(pair){
    var te = R === Infinity ? pair[0] : pair[0] / R, sgn = pair[1];
    if (R === Infinity){
      var ct = [pair[0] - sgn * f, r.yTop + f];
      var cb = [pair[0] - sgn * f, r.yBot - f];
      out.push({ f: f, sgn: sgn, ct: ct, cb: cb,
                 A: [ct[0], r.yTop], B: [ct[0] + sgn * f, ct[1]],
                 C: [cb[0] + sgn * f, cb[1]], D: [cb[0], r.yBot] });
      return;
    }
    /* A fillet of radius f tangent to the arc of radius rt from inside
       has its centre at radius rt - f; tangent to the radial line at
       angle te means its centre stands f away from that line, which puts
       it at angle te - asin(f / (rt - f)), NOT at te offset by an arc
       length of f. Both tangency points then follow from the CENTRE's
       own angle: radially for the arc, and the foot of the perpendicular
       for the flat.

       Taking the radial direction at te instead - which is what this did
       first - puts it 3.9 degrees out at the sizes here, and the frame
       came out of the PDF with a visible kink where each end met the
       bottom keyline. */
    var P = function(rr, t){ return [rr * Math.sin(t), R - rr * Math.cos(t)]; };
    var rT = r.rt - f, rB = r.rb + f;
    var dT = f > 0 ? Math.asin(Math.min(1, f / rT)) : 0;
    var dB = f > 0 ? Math.asin(Math.min(1, f / rB)) : 0;
    var tT = te - sgn * dT, tB = te - sgn * dB;
    out.push({
      f: f, sgn: sgn,
      ct: P(rT, tT), cb: P(rB, tB),
      A: P(r.rt, tT),                      // meets the top arc
      B: P(rT * Math.cos(dT), te),         // starts the flat
      C: P(rB * Math.cos(dB), te),         // ends the flat
      D: P(r.rb, tB)                       // meets the bottom arc
    });
  });
  return out;
}

function framePath(lay, r, inset){
  var c = endCaps(lay, r, inset), L = c[0], Rg = c[1], f = L.f;
  var arc = function(rr, p, sweep){
    return 'A' + rr + ' ' + rr + ' 0 0 ' + sweep + ' ' + p;
  };

  /* Pointed ends. The fillets and the flat between them are replaced
     by a single apex on the mid radius, `tip` further out along the
     arc - so each end is two straight runs from the keylines to a
     point, the same move the pendant makes at the bottom. */
  if (S.tip > 0){
    var R0 = lay.R, d = S.tip;
    var a0 = lay.at[0] - S.endgap + (inset || 0),
        a1 = lay.at[lay.at.length - 1] + S.endgap - (inset || 0);
    if (R0 === Infinity){
      var ym = (r.yTop + r.yBot) / 2;
      return 'M' + [a0, r.yTop] + 'L' + [a1, r.yTop] +
             'L' + [a1 + d, ym] + 'L' + [a1, r.yBot] +
             'L' + [a0, r.yBot] + 'L' + [a0 - d, ym] + 'Z';
    }
    var rm = (r.rt + r.rb) / 2;
    var P = function(rr, t){ return [rr * Math.sin(t), R0 - rr * Math.cos(t)]; };
    var t0 = a0 / R0, t1 = a1 / R0, dt = d / rm;
    return 'M' + P(r.rt, t0) +
           arc(r.rt, P(r.rt, t1), 1) +
           'L' + P(rm, t1 + dt) +
           'L' + P(r.rb, t1) +
           arc(r.rb, P(r.rb, t0), 0) +
           'L' + P(rm, t0 - dt) + 'Z';
  }
  if (lay.R === Infinity){
    /* Top edge, right fillet, right end, right fillet, bottom edge,
       left fillet, left end, left fillet. It has to start at A, the
       tangency on the TOP EDGE, not at B, the tangency on the end: B
       stands a fillet's radius below the top, so starting there drew
       the top edge through the middle of the plate and turned each end
       into a bowtie. With round at 0 the two points coincide and the
       wrong order works by accident, which is why only a stadium end
       ever showed it. */
    return 'M' + L.A + 'L' + Rg.A +
           (f > 0 ? arc(f, Rg.B, 1) : '') +
           'L' + Rg.C +
           (f > 0 ? arc(f, Rg.D, 1) : '') +
           'L' + L.D +
           (f > 0 ? arc(f, L.C, 1) : '') +
           'L' + L.B +
           (f > 0 ? arc(f, L.A, 1) : '') + 'Z';
  }
  return 'M' + L.A +
         arc(r.rt, Rg.A, 1) +
         (f > 0 ? arc(f, Rg.B, 1) : '') +
         'L' + Rg.C +
         (f > 0 ? arc(f, Rg.D, 1) : '') +
         arc(r.rb, L.D, 0) +
         (f > 0 ? arc(f, L.C, 1) : '') +
         'L' + L.B +
         (f > 0 ? arc(f, L.A, 1) : '') + 'Z';
}

function radii(lay, rr){
  var R = lay.R;
  var yTop = -rr.up - S.mtop - S.key / 2, yBot = rr.dn + S.mbot + S.key / 2;
  if (R === Infinity)
    return { rt: -yTop, rb: -yBot, up: rr.up, dn: rr.dn,
             yTop: yTop, yBot: yBot };
  return { rt: R + rr.up + S.mtop + S.key / 2,
           rb: R - rr.dn - S.mbot - S.key / 2,
           up: rr.up, dn: rr.dn, yTop: yTop, yBot: yBot };
}

/* How close the ink comes to the inside of the keyline.

   The same question the bead asked about its marks, and worth asking for
   the same reason: a flatter arch turns the end letters less, so their
   corners reach further along the plate than the centres the end gap is
   measured from, and the R can be touching the frame while the number
   that was set says 5 mm. Nothing here is eyeballed.

   Every letter path is walked at a third of a millimetre and each point
   taken into the plate's own polar frame. Clearance is then the least of
   three: to the top keyline, to the bottom one, and to whichever rounded
   end is nearer - that last one a plain distance to the circle the cap is
   struck on, which is what makes the ends honest. */
function clearance(lay, r){
  var paths = G.svg.querySelectorAll('g[data-ink] path[data-ch]');
  var R = lay.R, key = S.key / 2, caps = endCaps(lay, r), f = caps[0].f;
  var worst = Infinity, who = null;
  var ang = function(p){
    return R === Infinity ? p[0] : Math.atan2(p[0], R - p[1]);
  };
  var tL = ang(caps[0].B), tR = ang(caps[1].B);   // the flats
  var ctL = ang(caps[0].ct), cbL = ang(caps[0].cb);
  var ctR = ang(caps[1].ct), cbR = ang(caps[1].cb);

  /* Which boundary is nearest depends on where the point stands: inside a
     fillet's own quarter it is that fillet's circle, past the fillets it
     is the flat end, and in the middle of the plate it is one of the two
     keylines. Measuring every point against the end as well is what made
     the first version report the O as 89 mm inside a keyline it is
     nowhere near. */
  function gap(x, y){
    var rr = R === Infinity ? -y : Math.hypot(x, R - y);
    var t = R === Infinity ? x : Math.atan2(x, R - y);
    var rt = R === Infinity ? -r.yTop : r.rt;
    var rb = R === Infinity ? -r.yBot : r.rb;
    if (f > 0){
      if (rr > rt - f){
        if (t > ctR) return f - Math.hypot(x - caps[1].ct[0], y - caps[1].ct[1]) - key;
        if (t < ctL) return f - Math.hypot(x - caps[0].ct[0], y - caps[0].ct[1]) - key;
      }
      if (rr < rb + f){
        if (t > cbR) return f - Math.hypot(x - caps[1].cb[0], y - caps[1].cb[1]) - key;
        if (t < cbL) return f - Math.hypot(x - caps[0].cb[0], y - caps[0].cb[1]) - key;
      }
    }
    var toEnd = R === Infinity ? Math.min(tR - t, t - tL)
                               : Math.min((tR - t) * rr, (t - tL) * rr);
    return Math.min(rt - rr, rr - rb, toEnd) - key;
  }

  for (var i = 0; i < paths.length; i++){
    var el = paths[i], len = el.getTotalLength();
    // The element's OWN transform, not getCTM: that one goes all the way
    // to the viewport and carries the viewBox with it, so the answer
    // would come out in screen pixels and change with the window.
    // the transform now lives on the letter's group, not on the path, so
    // the walk has to compose the path's own with its parent's
    var own = el.transform.baseVal.consolidate();
    var par = el.parentNode.transform.baseVal.consolidate();
    if (!len || !par) continue;
    var m = own ? par.matrix.multiply(own.matrix) : par.matrix;
    // lengths are in the glyph's own units - source pixels - so a third
    // of a millimetre is a third divided by the scale
    var step = Math.max(0.33 / lay.mm, len / 3000);
    for (var l = 0; l <= len; l += step){
      var q = el.getPointAtLength(l).matrixTransform(m);
      var d = gap(q.x, q.y);
      if (d < worst){ worst = d; who = el.getAttribute('data-ch'); }
    }
  }
  return { mm: worst, ch: who };
}

/* The pendant under the plate. Its two edges are arcs about the same
   centre as everything else, so it sits concentric with the plate rather
   than merely near it, and its bottom comes to a point in the middle -
   a tag hanging off the plate rather than a second band beside it.

   It is JOINED to the plate, not set below it. The band runs up past the
   plate's lower keyline and is drawn before the plate, so the plate's
   own paper covers the overlap and its keyline carries straight across:
   one outline, a ribbon coming out from under the plate. Two bands with
   a gap between them would be two drawings on one sheet.

   Because the top of the band is hidden, its depth is measured from the
   plate's keyline down rather than from its own top edge - otherwise
   deepening the overlap would eat the part that shows. The type sits in
   the band between the keyline and the shoulders; the point hangs below
   it and carries no type, which is what gives it somewhere to go.

   The type is set along it, each letter turned to its own radius the way
   the name is. It arrives as outlines rather than as a font: a drawing
   that names a typeface renders differently on a machine without it, and
   a plate going to a maker is the wrong place to discover that. */
function bannerPath(lay, r){
  var R = lay.R;
  var dS = S.bdepth, dA = S.bdepth + S.bpoint;   // shoulder, apex
  var k = Math.max(0, Math.min(1, S.bcurve));
  var hw = S.bwidth / 2;
  var f = Math.max(0, Math.min(S.bround, 0.45 * dS, 0.30 * hw));

  if (R === Infinity){
    var y0 = r.yBot + S.bgap, yS = r.yBot + dS, yA = r.yBot + dA;
    var ym = (r.yBot + yS) / 2;
    var xs = hw - f;
    var sweep = function(sgn){
      return 'C' + [sgn * hw * (1 - 0.55 * k), yS] + ' ' +
                   [sgn * hw * 0.18 * k, yS + (yA - yS) * (1 - 0.55 * k)] +
             ' ' + [0, yA];
    };
    var arc = function(p){ return 'A' + f + ' ' + f + ' 0 0 1 ' + p; };
    return { d: 'M' + [-hw, y0] + 'L' + [hw, y0] + 'L' + [hw, yS - f] +
                (f > 0 ? arc([xs, yS]) : '') + sweep(+1) +
                'C' + [-hw * 0.18 * k, yS + (yA - yS) * (1 - 0.55 * k)] + ' ' +
                      [-hw * (1 - 0.55 * k), yS] + ' ' + [-xs, yS] +
                (f > 0 ? arc([-hw, yS - f]) : 'L' + [-hw, yS]) + 'Z',
             base: ym + S.bcap / 2, mid: ym, straight: true };
  }

  var P = function(rr, t){ return [rr * Math.sin(t), R - rr * Math.cos(t)]; };
  var rT = r.rb - S.bgap;                  // behind the plate when bgap < 0
  var rS = r.rb - dS, rA = r.rb - dA;
  var rm = (r.rb + rS) / 2;                // middle of the band on show
  var w = (S.bwidth / 2) / rm;

  /* The shoulder is where the side comes down and the bottom sets off
     along the band, so it is a right angle, and a right angle is what
     was circled. The fillet is struck the way the frame's ends are, not
     by eye: tangent to the arc of radius rS from outside puts its
     centre at rS + f, and tangent to the radial line at angle w puts
     that centre at angle w - asin(f / (rS + f)). Both tangency points
     follow from the CENTRE's own angle - radially for the arc, the foot
     of the perpendicular for the side. Offsetting the angle by an arc
     length of f instead is the mistake that left a visible kink in the
     frame, and it would leave one here. */
  var rc = rS + f;
  var dw = f > 0 ? Math.asin(Math.min(1, f / rc)) : 0;
  var tc = w - dw;                          // the fillet centre's angle
  var ws = tc;                              // where the bottom now starts
  var side = f > 0 ? rc * Math.cos(dw) : rS; // where the side now ends

  /* Each half of the bottom is one cubic from a shoulder to the point.
     It leaves the shoulder at constant radius, so it runs along the
     band rather than turning a corner there - and so it is tangent to
     the fillet that now stands in that corner - and comes into the
     point steeply, so the two halves meet as a point and not as a curve
     with a crease. The control points are struck in the plate's own
     polar frame and then converted, which is what keeps the sweep
     concentric with everything else. */
  var c1 = function(sgn){ return P(rS, sgn * w * (1 - 0.55 * k)); };
  var c2 = function(sgn){
    return P(rA + (rS - rA) * (1 - 0.55 * k), sgn * w * 0.18 * k);
  };
  /* Each fillet is quarter-ish of a circle traversed the same way round
     as the rest of the outline, so both take sweep 1: down-then-inboard
     at the right shoulder, inboard-then-up at the left. */
  var arc = function(p){ return 'A' + f + ' ' + f + ' 0 0 1 ' + p; };

  return {
    d: 'M' + P(rT, -w) +
       'A' + rT + ' ' + rT + ' 0 0 1 ' + P(rT, w) +
       'L' + P(side, w) +
       (f > 0 ? arc(P(rS, ws)) : '') +
       'C' + c1(+1) + ' ' + c2(+1) + ' ' + P(rA, 0) +
       'C' + c2(-1) + ' ' + c1(-1) + ' ' + P(rS, -ws) +
       (f > 0 ? arc(P(side, -w)) : '') + 'Z',
    base: rm - S.bcap / 2, mid: rm, straight: false
  };
}

function drawBanner(g, lay, r, cInk, cPlate, cKey){
  if (!S.banner || !DOC.banner) return;
  var B = DOC.banner, bp = bannerPath(lay, r), R = lay.R;
  var plate = el('path');
  plate.setAttribute('d', bp.d);
  plate.setAttribute('fill', cPlate);
  plate.setAttribute('stroke', cKey || cInk);
  plate.setAttribute('stroke-width', S.key);
  plate.setAttribute('stroke-linejoin', 'round');
  g.appendChild(plate);

  var s = S.bcap / B.cap;                       // font units -> mm
  var adv = [], total = 0;
  B.glyphs.forEach(function(gl, i){
    var a = gl.adv * s + (i < B.glyphs.length - 1
      ? (B.kern[i] || 0) * s + S.btrack : 0);
    adv.push(a); total += a;
  });
  var type = el('g');
  type.setAttribute('fill', cInk);
  g.appendChild(type);
  var at = -total / 2;
  B.glyphs.forEach(function(gl, i){
    if (gl.d){
      var cx = at + gl.adv * s / 2, t, tr;
      if (R === Infinity){
        tr = 'translate(' + cx + ' ' + bp.base + ')';
      } else {
        t = cx / bp.base;
        tr = 'translate(' + (bp.base * Math.sin(t)) + ' ' +
             (R - bp.base * Math.cos(t)) + ') rotate(' + (t * 180 / Math.PI) + ')';
      }
      var pth = el('path');
      pth.setAttribute('d', gl.d);
      // font units are y-up and centred on the glyph's own origin
      pth.setAttribute('transform', tr + ' scale(' + s + ' ' + (-s) + ') ' +
                       'translate(' + (-gl.adv / 2) + ' 0)');
      type.appendChild(pth);
    }
    at += adv[i];
  });
}

/* --- drawing --------------------------------------------------------- */

function draw(){
  var lay = layout(), rr = reach(lay), r = radii(lay, rr);
  var svg = G.svg;
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  var g = el('g');
  svg.appendChild(g);

  if (S.ghost){
    var im = el('image');
    im.setAttributeNS('http://www.w3.org/1999/xlink', 'href', 'source.jpg');
    var mm = lay.mm;
    im.setAttribute('width', DOC.px.w * mm);
    im.setAttribute('height', DOC.px.h * mm);
    // put the source's own baseline apex on this drawing's origin
    im.setAttribute('x', -DOC.arc.cx * mm);
    im.setAttribute('y', -(DOC.arc.cy - DOC.arc.r_base) * mm);
    im.setAttribute('opacity', '0.38');
    g.appendChild(im);
  }

  /* Two colours and no more. On screen they are the plate's cream and a
     near-black, which is what the artwork looks like; as a drawing they
     are #fff and #000, because a drawing that will be cut, etched or
     printed has an inside and an outside and nothing in between, and a
     near-black is a colour someone has to decide about later. */
  var cPlate = S.bw ? '#ffffff' : getCSS('--plate');
  var cKey = S.bw ? '#000000' : getCSS('--key');
  var cInk = S.bw ? '#000000' : '#2b2825';
  /* Inverted, the plate's own keyline has nothing to do - it would be
     ink drawn on ink - so it takes the plate's colour and simply makes
     the shape a hair larger. The INNER rule is the one that still has
     a job, and inverted that job is a paper line inside the ink, so it
     follows the letters rather than the frame. Giving both of them the
     plate colour, which is what this did first, left the rule invisible
     and three of the five variants identical. */
  var cRule = cKey;
  if (S.invert){
    var sw = cPlate; cPlate = cInk; cInk = sw;
    cKey = cPlate; cRule = cInk;
  }

  var fp = framePath(lay, r);
  /* The inner rule is the same frame struck a little smaller: the radii
     pulled in, the ends pulled in by the same amount along the arc, so
     it stays concentric and parallel instead of merely similar. */
  function inner(d){
    return framePath(lay, { rt: r.rt - d, rb: r.rb + d, up: r.up, dn: r.dn,
                            yTop: r.yTop + d, yBot: r.yBot - d }, d);
  }
  // before the plate: the plate's paper hides the overlap and its
  // keyline is then the line the two shapes share
  drawBanner(g, lay, r, cInk, cPlate, cKey);
  var plate = el('path');
  plate.setAttribute('d', fp);
  plate.setAttribute('fill', cPlate);
  plate.setAttribute('stroke', cKey);
  plate.setAttribute('stroke-width', S.key);
  plate.setAttribute('stroke-linejoin', 'round');
  if (S.frame) g.appendChild(plate);
  if (S.frame && S.rule > 0 && S.rule < (r.rt - r.rb) / 2 - 0.2){
    var ir = el('path');
    ir.setAttribute('d', inner(S.rule));
    ir.setAttribute('fill', 'none');
    ir.setAttribute('stroke', cRule);
    ir.setAttribute('stroke-width', S.rulew);
    ir.setAttribute('stroke-linejoin', 'round');
    g.appendChild(ir);
  }

  var letters = el('g');
  letters.setAttribute('data-ink', '1');
  letters.setAttribute('fill', cInk);
  letters.setAttribute('fill-rule', 'evenodd');
  g.appendChild(letters);

  /* Each letter the way the reference builds one: a cast shadow behind
     it, paper inside it, ruled hatching over the paper, the lit side
     left blank, and a fine keyline round the whole thing with a paper
     halo just inside. The hatching is drawn, not traced - at a 2 to 4
     pixel pitch in the source it is below what the file holds, so it is
     ruled at whatever pitch is asked for and comes out even, which the
     original is not.

     Lengths inside a letter are in the glyph's own units, so every width
     given in millimetres is divided by the scale on the way in. */
  var defs = el('defs');
  svg.insertBefore(defs, svg.firstChild);
  var u = 1 / lay.mm;                               // mm -> glyph units

  lay.place.forEach(function(p, i){
    var t = 'translate(' + p.x + ' ' + p.y + ') rotate(' + p.deg +
            ') scale(' + lay.mm + ')';
    var body = p.src.paths.join(' ');
    var g = el('g');
    g.setAttribute('transform', t);
    letters.appendChild(g);

    if (!S.engraved){
      var solid = el('path');
      solid.setAttribute('d', body);
      solid.setAttribute('fill', cInk);
      solid.setAttribute('data-ch', p.ch);
      g.appendChild(solid);
      /* The ornament the drawing already carries - the barbs where
         strokes meet, the curls, the inner line - cut OUT of the black
         rather than drawn on paper. Same marks the engraved view uses,
         read the other way round, so the letter keeps the weight of
         the plain version and stops being a slab. */
      if (S.cut && p.src.detail && p.src.detail.length){
        var ct = el('path');
        ct.setAttribute('d', p.src.detail.join(' '));
        ct.setAttribute('fill', cPlate);
        ct.setAttribute('fill-rule', 'evenodd');
        g.appendChild(ct);
      }
      return;
    }

    if (S.shadow > 0){
      var sh = el('path');
      sh.setAttribute('d', body);
      sh.setAttribute('fill', cInk);
      sh.setAttribute('transform', 'translate(' + (S.shadow * 0.55 * u) +
                      ' ' + (S.shadow * u) + ')');
      g.appendChild(sh);
    }

    var paper = el('path');
    paper.setAttribute('d', body);
    paper.setAttribute('fill', cPlate);
    paper.setAttribute('data-ch', p.ch);
    g.appendChild(paper);

    /* The hatch is clipped to the region the engraver actually ruled -
       which plate.json carries, measured by stripe energy - and not to
       the whole letter. Clip it to the letter and every stroke reads
       flat: the blank lit side is what makes it look modelled. */
    var ruled = (S.inlay && p.src.inlay.length) ? p.src.inlay.join(' ') : body;
    var cid = 'ruled' + i;
    var cp = el('clipPath');
    cp.setAttribute('id', cid);
    var cpp = el('path');
    cpp.setAttribute('d', ruled);
    cpp.setAttribute('clip-rule', 'evenodd');
    cp.appendChild(cpp);
    defs.appendChild(cp);

    var inside = el('g');
    inside.setAttribute('clip-path', 'url(#' + cid + ')');
    if (S.hatching) g.appendChild(inside);

    var b = bounds(p.src), pitch = Math.max(S.pitch * u, 0.6);
    var d = [];
    for (var y = Math.floor(b.y0 / pitch) * pitch; y <= b.y1; y += pitch)
      d.push('M' + (b.x0 - 2) + ' ' + y.toFixed(2) + 'H' + (b.x1 + 2));
    var hatch = el('path');
    hatch.setAttribute('d', d.join(''));
    hatch.setAttribute('fill', 'none');
    hatch.setAttribute('stroke', cInk);
    hatch.setAttribute('stroke-width', S.hatch * u);
    inside.appendChild(hatch);

    /* The line where the hatching stops. In the reference the boundary
       between ruled and blank is drawn, not just implied, and it is most
       of what reads as detail: without it the hatching fades into the
       paper and the lower half of every letter goes to mush. */
    if (S.edge > 0 && S.inlay && p.src.inlay.length){
      var ed = el('path');
      ed.setAttribute('d', ruled);
      ed.setAttribute('fill', 'none');
      ed.setAttribute('fill-rule', 'evenodd');
      ed.setAttribute('stroke', cInk);
      ed.setAttribute('stroke-width', S.edge * u);
      ed.setAttribute('stroke-linejoin', 'round');
      inside.appendChild(ed);
    }

    /* Round the letter, three lines and not one: the keyline on the
       boundary, a band of paper just inside it, and a second finer line
       inside that. SVG cannot offset a path, but it can stack strokes -
       a black one 2(halo+inline) wide, then a paper one 2*halo wide over
       it, both clipped to the letter, leave exactly the band between
       halo and halo+inline standing. That doubled contour is what makes
       an engraved letter look cut rather than filled. */
    if (S.halo > 0){
      var hc = el('clipPath');
      hc.setAttribute('id', 'body' + i);
      var hcp = el('path');
      hcp.setAttribute('d', body);
      hc.appendChild(hcp);
      defs.appendChild(hc);
      var hg = el('g');
      hg.setAttribute('clip-path', 'url(#body' + i + ')');
      if (S.inline > 0){
        var inl = el('path');
        inl.setAttribute('d', body);
        inl.setAttribute('fill', 'none');
        inl.setAttribute('stroke', cInk);
        inl.setAttribute('stroke-width', 2 * (S.halo + S.inline) * u);
        hg.appendChild(inl);
      }
      var ha = el('path');
      ha.setAttribute('d', body);
      ha.setAttribute('fill', 'none');
      ha.setAttribute('stroke', cPlate);
      ha.setAttribute('stroke-width', 2 * S.halo * u);
      hg.appendChild(ha);
      g.appendChild(hg);
    }

    /* The drawing's own lines, on top of the ruling: the keyline, the
       finer line inside it, the barbs and curls where the strokes meet,
       the cast shadow. These are traced from the picture - a cut at 125
       with the ruling opened out from under it - so they are the shapes
       that were drawn, not shapes inferred from a silhouette. Thirty to
       sixty-five contours a letter against seven to nineteen for the
       outline alone, and that difference is the detail. */
    if (S.detail && p.src.detail && p.src.detail.length){
      var dl = el('path');
      dl.setAttribute('d', p.src.detail.join(' '));
      dl.setAttribute('fill', cInk);
      dl.setAttribute('fill-rule', 'evenodd');
      g.appendChild(dl);
    }
    if (S.outline > 0){
      var line = el('path');
      line.setAttribute('d', body);
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke', cInk);
      line.setAttribute('stroke-width', S.outline * u);
      line.setAttribute('stroke-linejoin', 'round');
      g.appendChild(line);
    }
  });

  // fit the view to everything drawn, with a little air
  var bb = svg.getBBox();
  var pad = Math.max(bb.width, bb.height) * 0.06 + S.key;
  svg.setAttribute('viewBox', [bb.x - pad, bb.y - pad,
                               bb.width + 2*pad, bb.height + 2*pad].join(' '));
  G.last = { w: bb.width, h: bb.height, lay: lay, r: r, frame: fp };
  G.last.clear = clearance(lay, r);
  readout();
}
function getCSS(v){
  return getComputedStyle(document.documentElement).getPropertyValue(v).trim();
}

function readout(){
  var L = G.last, lay = L.lay;
  var txt = L.w.toFixed(1) + ' × ' + L.h.toFixed(1) + ' mm';
  if (lay.R !== Infinity) txt += '  ·  arch radius ' + lay.R.toFixed(0) + ' mm';
  else txt += '  ·  straight';
  txt += '  ·  letters ' + lay.span.toFixed(1) + ' mm along the baseline';
  var cl = L.clear;
  if (cl && isFinite(cl.mm))
    txt += '  ·  ' + (cl.mm < 0
      ? cl.ch + ' into the keyline by ' + (-cl.mm).toFixed(2) + ' mm'
      : cl.mm.toFixed(2) + ' mm clear at the ' + cl.ch);
  document.getElementById('dims').textContent = txt;
}

/* --- controls -------------------------------------------------------- */

function slider(host, name, lo, hi, stepv, get, set, fmt){
  var row = h('div', 'row');
  row.appendChild(h('label', null, name));
  var b = h('b', null, fmt(get()));
  row.appendChild(b);
  var inp = document.createElement('input');
  inp.type = 'range'; inp.min = lo; inp.max = hi; inp.step = stepv;
  inp.value = get();
  inp.addEventListener('input', function(){
    set(+inp.value); b.textContent = fmt(get()); draw();
  });
  row.appendChild(inp);
  host.appendChild(row);
  return function(){ inp.value = get(); b.textContent = fmt(get()); };
}

    var btn = h('button', null, t[0]);
    btn.type = 'button';
    btn.setAttribute('aria-pressed', S[t[1]] ? 'true' : 'false');
    btn.addEventListener('click', function(){
      S[t[1]] = !S[t[1]];
      btn.setAttribute('aria-pressed', S[t[1]] ? 'true' : 'false');
      if (t[1] === 'reuse') FIRST = {};
      draw();
    });
    chips.appendChild(btn);
  });
  var acts = h('div', 'chips');
  c.appendChild(acts);
  var rst = h('button', null, 'As drawn');
  rst.type = 'button';
  rst.addEventListener('click', function(){
    S = JSON.parse(JSON.stringify(D0));
    sync.forEach(function(f){ f(); });
    panel(); draw();
  });
  acts.appendChild(rst);
  var exp = h('button', 'go', 'Download SVG');
  exp.type = 'button';
  exp.addEventListener('click', function(){ saveSVG(exp); });
  acts.appendChild(exp);
  var cp = h('button', null, 'Copy settings');
  cp.type = 'button';
  cp.addEventListener('click', function(){
    navigator.clipboard.writeText(JSON.stringify(S, null, 2));
    cp.textContent = 'Copied'; setTimeout(function(){ cp.textContent = 'Copy settings'; }, 1200);
  });
  acts.appendChild(cp);

  c.appendChild(h('p', 'note',
    'Arch rise is how far the baseline bows over the word, so 0 is a '
    + 'straight line; the drawing it was traced from had 6.67 mm, this '
    + 'opens on 4.80. Letter spacing adds to the gaps the artwork already '
    + 'has, which are uneven by up to 20 per cent; it opens on 1.10 mm '
    + 'rather than the drawing\u2019s nothing. The frame follows the '
    + 'letters: margin is the gap from the ink to the keyline, ends is the '
    + 'extra arc past the centre of the first and last letter \u2014 so '
    + 'the readout, not that number, is what says whether the ink clears '
    + 'the keyline.'));
  c.appendChild(h('p', 'note',
    'Margins are the clear gap from the ink to the inside of the keyline. '
    + 'In the drawing the umlaut has 0.04 mm above it — it touches, and '
    + 'in the picture the left dot is joined to the frame by a six pixel '
    + 'neck. It opens to 0.80 mm here, which is the one liberty taken with '
    + 'the geometry; wind it back down to see the original. The two '
    + 'keylines were struck about centres 71 px apart, so the real plate is '
    + '1.4 per cent out of true; this one is concentric.'));
}

/* The artifact viewer never hands a page download permission on its own,
   so a plain <a download> does nothing there. The downloads capability is
   the mediated way: it asks the viewer and saves. Opened as a file from
   the repository there is no capability at all, and the anchor works -
   hence both, with the capability first. */
var DL = null, DL_TRIED = false;
if (window.claude && typeof claude.use === 'function')
  claude.use('downloads').then(function(d){ DL = d; DL_TRIED = true; })
    .catch(function(){ DL_TRIED = true; });

function buildSVG(){
  var pad = 2;
  var clone = G.svg.cloneNode(true);
  var im = clone.querySelector('image');
  if (im) im.parentNode.removeChild(im);
  var bb = G.svg.getBBox();
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.setAttribute('width', (bb.width + 2*pad).toFixed(3) + 'mm');
  clone.setAttribute('height', (bb.height + 2*pad).toFixed(3) + 'mm');
  clone.setAttribute('viewBox', [bb.x - pad, bb.y - pad,
    bb.width + 2*pad, bb.height + 2*pad].map(function(v){
      return (+v).toFixed(3); }).join(' '));
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + clone.outerHTML + '\n';
}

function saveSVG(btn){
  var txt = buildSVG(), name = 'oberndorfer-nameplate.svg';
  var say = function(t){
    btn.textContent = t;
    setTimeout(function(){ btn.textContent = 'Download SVG'; }, 1800);
  };
  if (DL){
    DL.save({ filename: name, data: txt })
      .then(function(){ say('Saved'); })
      .catch(function(e){
        say(e && e.code === 'declined' ? 'Download SVG' : 'Not available');
      });
    return;
  }
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type: 'image/svg+xml'}));
  a.download = name;
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  say('Saved');
}

/* --- boot ------------------------------------------------------------ */

function boot(){
  var svg = el('svg');
  svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  G.svg = svg;
  fetch('plate.json').then(function(r){ return r.json(); }).then(function(d){
    DOC = d;
    var st = document.getElementById('stage');
    st.innerHTML = '';
    st.appendChild(svg);
    panel();
    draw();
    window.ready = true;
  }).catch(function(e){
    document.getElementById('boot').textContent = 'could not load: ' + e.message;
    window.ready = 'error: ' + e.message;
  });
}
window.ready = false;
if (document.readyState === 'loading')
  document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
