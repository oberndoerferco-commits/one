<style>
/* Layout: full-bleed viewport for the part, with an engineering title block docked bottom-left. */
:root{
  --ink:#0b0d10;          /* chamber */
  --ink-2:#14181d;        /* panel */
  --line:#2a3139;         /* rules */
  --silver:#dfe4ea;       /* primary text, matches the finish */
  --silver-dim:#8b949e;   /* labels */
  --amber:#c8963e;        /* the one accent: active controls */
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--silver);font-family:var(--sans);overflow:hidden}
#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}

.block{
  position:fixed;
  left:max(16px,env(safe-area-inset-left,0px));
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  z-index:3;
  width:min(330px,calc(100vw - max(32px,env(safe-area-inset-left,0px) + env(safe-area-inset-right,0px))));
  background:color-mix(in srgb,var(--ink-2) 86%,transparent);
  border:1px solid var(--line);
  backdrop-filter:blur(10px);
}
.block h1{
  margin:0;padding:10px 14px;border-bottom:1px solid var(--line);
  font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
}
.rows{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:12px 14px;
  font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.rows dt{color:var(--silver-dim)}
.rows dd{margin:0;text-align:right}
.ctl{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--silver-dim);flex:0 0 76px}
.row output{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;flex:0 0 52px;text-align:right}
input[type=range]{flex:1 1 auto;min-width:0;accent-color:var(--amber);height:22px}
.seg{display:flex;border:1px solid var(--line);flex:1 1 auto;min-width:0}
.seg button{
  flex:1 1 0;min-width:0;padding:7px 4px;background:transparent;border:0;cursor:pointer;
  color:var(--silver-dim);font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--amber);color:#1a1206;font-weight:600}
.seg button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hint{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));
  left:max(16px,env(safe-area-inset-left,0px));z-index:3;
  font-family:var(--mono);font-size:11px;color:var(--silver-dim);letter-spacing:.04em}
@media (max-width:560px){ .block{width:calc(100vw - 32px)} .rows{font-size:11px} }
@media (prefers-reduced-motion:reduce){ :root{--spin:0} }
</style>

  /* Studio environment: a dark room with three softboxes, so satin metal
     shows soft banded highlights instead of a mirror image. */
  function studioEnv(){
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 512;
    const g = c.getContext('2d');
    const bg = g.createLinearGradient(0,0,0,512);
    bg.addColorStop(0.00,'#11141a');
    bg.addColorStop(0.34,'#6a7482');
    bg.addColorStop(0.46,'#9fb0c2');
    bg.addColorStop(0.54,'#1b1f26');
    bg.addColorStop(1.00,'#050608');
    g.fillStyle = bg; g.fillRect(0,0,1024,512);
    // hard-edged strips: satin metal reads as banded streaks, not a blur
    g.fillStyle = 'rgba(255,255,255,0.80)'; g.fillRect(90, 96, 430, 54);
    g.fillStyle = 'rgba(255,255,255,0.45)'; g.fillRect(620, 150, 300, 30);
    g.fillStyle = 'rgba(0,0,0,0.55)';       g.fillRect(0, 196, 1024, 26);
    function box(cx,cy,w,h,a){
      const r = g.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)/2);
      r.addColorStop(0,'rgba(255,255,255,'+a+')');
      r.addColorStop(1,'rgba(255,255,255,0)');
      g.save(); g.translate(cx,cy); g.scale(1, h/w); g.translate(-cx,-cy);
      g.fillStyle = r; g.beginPath(); g.arc(cx,cy,w/2,0,Math.PI*2); g.fill(); g.restore();
    }
    box(250,120,520,190,0.9);
    box(770,140,330,130,0.55);
    box(520,330,700,110,0.18);
    const t = new THREE.CanvasTexture(c);
    t.mapping = THREE.EquirectangularReflectionMapping;
    const pm = new THREE.PMREMGenerator(renderer);
    pm.compileEquirectangularShader();
    const rt = pm.fromEquirectangular(t);
    t.dispose(); pm.dispose();
    return rt.texture;
  }
  scene.environment = studioEnv();

  const key = new THREE.DirectionalLight(0xffffff, 0.9);
  key.position.set(-40, 55, 70); scene.add(key);
  const fill = new THREE.DirectionalLight(0xbfd0e6, 0.5);
  fill.position.set(60, -20, 40); scene.add(fill);
  scene.add(new THREE.AmbientLight(0xffffff, 0.08));

  const satinSilver = new THREE.MeshStandardMaterial({
    color: 0xdcdfe4, metalness: 1.0, roughness: 0.30,
    envMapIntensity: 1.45
  });

  /* PDF space has y running down; flip it and centre the artwork. */
  const P = (p) => new THREE.Vector2(p[0] - W/2, (H/2) - p[1]);
  function shapeOf(outer, holes){
    const s = new THREE.Shape(outer.map(P));
    (holes||[]).forEach(h => s.holes.push(new THREE.Path(h.map(P))));
    return s;
  }
  const group = new THREE.Group(); scene.add(group);
  let built = [];
  function clear(){ built.forEach(m => { m.geometry.dispose(); group.remove(m); }); built = []; }
  /* The six pieces are the logo itself: P, A, ampersand, C, the O with its
     bar, and the diamond. Nothing is added underneath them. */
  function build(mode, t){
    clear();
    const bevel = mode === 'bevel';
    // the thinnest stroke is 1.05 mm, so the chamfer stays well inside it
    const b = bevel ? Math.min(0.10, t * 0.18) : 0;
    const opts = {
      depth: t - 2 * b, curveSegments: 4,
      bevelEnabled: bevel, bevelThickness: b, bevelSize: b, bevelSegments: 2
    };
    LOGO.s.forEach(sh => {
      const g = new THREE.ExtrudeGeometry(shapeOf(sh.o, sh.h), opts);
      const m = new THREE.Mesh(g, satinSilver);
      m.position.z = -t / 2 + b;
      group.add(m); built.push(m);
    });
  }

  // --- orbit (hand-rolled: r128's OrbitControls is not on the allowed CDN)
  let az = -0.38, el = 0.70, dist = 96, spin = true;
  let drag = null;
  const el2 = renderer.domElement;
  el2.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY}; el2.setPointerCapture(e.pointerId); });
  el2.addEventListener('pointermove', e => {
    if (!drag) return;
    az -= (e.clientX - drag.x) * 0.006;
    el = Math.max(0.12, Math.min(1.50, el - (e.clientY - drag.y) * 0.005));
    drag = {x:e.clientX, y:e.clientY};
  });
  const stop = e => { drag = null; };
  el2.addEventListener('pointerup', stop); el2.addEventListener('pointercancel', stop);
  el2.addEventListener('wheel', e => {
    e.preventDefault();
    dist = Math.max(62, Math.min(260, dist + e.deltaY * 0.12));
  }, {passive:false});

  function resize(){
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t0 = performance.now();
  function frame(t){
    const dt = Math.min(0.05, (t - t0) / 1000); t0 = t;
    if (spin && !drag && !reduce) az += dt * 0.19;
    const ce = Math.cos(el), se = Math.sin(el);
    camera.position.set(Math.sin(az)*dist*ce, -Math.cos(az)*dist*ce, se*dist);
    camera.up.set(0,0,1);
    camera.lookAt(-4.0,-1.5,0);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // --- controls
  let mode = 'bevel', depth = 1.50;
  const depthIn = document.getElementById('depth');
  const depthVal = document.getElementById('depthVal');
  const depthOut = document.getElementById('depthOut');
  function setDepth(v){
    depth = v;
    const s = v.toFixed(2);
    depthVal.value = s; depthOut.textContent = s;
    build(mode, depth);
  }
  depthIn.addEventListener('input', () => setDepth(parseFloat(depthIn.value)));
  document.getElementById('relief').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.mode;
    [...e.currentTarget.children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    build(mode, depth);
  });
  document.getElementById('spin').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    spin = b.dataset.spin === '1';
    [...e.currentTarget.children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  });

  setDepth(1.50);
  requestAnimationFrame(frame);
})();
</script>
